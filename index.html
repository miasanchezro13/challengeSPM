<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Challenge — PM Yape</title>
<style>
:root{
  --purple:#7c3aed;--purple2:#a78bfa;--cyan:#67e8f9;--green:#34d399;--red:#f87171;--amber:#fcd34d;
  --bg:#09051a;--card:#110930;--card2:#1c1040;--border:rgba(167,139,250,.22);
  --text:#ede9fe;--muted:#b9a8db;--dim:#786a9b;--mono:ui-monospace,SFMono-Regular,Menlo,monospace;--sans:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 15% 20%,rgba(124,58,237,.17),transparent 35%),radial-gradient(circle at 85% 80%,rgba(103,232,249,.06),transparent 32%)}
#app{position:relative;z-index:1;min-height:100vh}.screen{min-height:100vh;padding:24px;display:flex;align-items:center;justify-content:center}.shell{width:min(1080px,100%)}
.card{background:rgba(17,9,48,.94);border:1px solid var(--border);border-radius:20px;padding:28px;box-shadow:0 20px 70px rgba(0,0,0,.25)}
.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:18px}.logo{font:800 24px var(--mono);background:linear-gradient(135deg,var(--purple2),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}.badge{display:inline-flex;border:1px solid var(--border);background:rgba(124,58,237,.14);color:var(--purple2);border-radius:999px;padding:6px 10px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em}.title{font-size:clamp(28px,4vw,44px);line-height:1.05;margin:14px 0}.subtitle{color:var(--muted);line-height:1.65;max-width:760px}.progress{height:5px;background:rgba(167,139,250,.1);border-radius:999px;overflow:hidden;margin:18px 0 16px}.progress>div{height:100%;width:0;background:linear-gradient(90deg,var(--purple),var(--cyan));transition:width .25s}.steps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.step{font-size:12px;padding:6px 10px;border-radius:999px;border:1px solid var(--border);color:var(--dim)}.step.active{color:var(--purple2);border-color:var(--purple2);background:rgba(124,58,237,.12)}.step.done{color:var(--green);border-color:rgba(52,211,153,.35);background:rgba(52,211,153,.08)}
h1,h2,h3{margin:0 0 10px}h2{font-size:28px}h3{font-size:17px}.section{margin-top:20px}.section h3{color:var(--purple2)}
.grid{display:grid;gap:12px}.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}@media(max-width:800px){.grid2,.grid3{grid-template-columns:1fr}}
.box{border:1px solid var(--border);border-radius:14px;background:rgba(28,16,64,.48);padding:16px}.box.soft{background:rgba(124,58,237,.07)}
.kpi{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid rgba(167,139,250,.08)}.kpi:last-child{border-bottom:0}
label{display:block;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px}input,textarea,select{width:100%;background:#0d0820;color:var(--text);border:1px solid var(--border);border-radius:10px;padding:11px 12px;font:inherit;outline:none}textarea{min-height:150px;resize:vertical}input:focus,textarea:focus,select:focus{border-color:var(--purple2);box-shadow:0 0 0 3px rgba(167,139,250,.12)}
.option{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--border);border-radius:12px;background:rgba(17,9,48,.45);cursor:pointer}.option:hover{border-color:rgba(167,139,250,.45)}.option input{width:auto;margin-top:3px}.option.selected{border-color:var(--purple2);background:rgba(124,58,237,.14)}
.btns{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:22px}.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:800;cursor:pointer}.primary{background:linear-gradient(135deg,#6d28d9,#7c3aed);color:#fff}.ghost{background:transparent;color:var(--purple2);border:1px solid var(--border)}.btn:disabled{opacity:.45;cursor:not-allowed}.hint{font-size:12px;color:var(--dim)}
.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:10px;border-bottom:1px solid rgba(167,139,250,.10);vertical-align:top}.table th{color:var(--purple2);text-align:left;background:rgba(124,58,237,.08)}.num{text-align:right;font-family:var(--mono)}
.choice-card{position:relative}.choice-card input{position:absolute;opacity:0}.choice-card .inner{border:1px solid var(--border);border-radius:12px;padding:14px;height:100%;cursor:pointer}.choice-card input:checked + .inner{border-color:var(--purple2);background:rgba(124,58,237,.12)}
.priority-list{display:flex;flex-direction:column;gap:8px}.priority-item{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:rgba(17,9,48,.45);cursor:grab}.priority-item.dragging{opacity:.5;border-color:var(--purple2)}.priority-num{font:800 13px var(--mono);color:var(--cyan);text-align:center}.priority-handle{color:var(--dim);font-size:18px}.priority-empty{padding:14px;border:1px dashed var(--border);border-radius:10px;color:var(--dim);font-size:12px;text-align:center}.sprint-select{width:110px;padding:8px 9px}.mvp-row{display:grid;grid-template-columns:minmax(260px,1.5fr) minmax(280px,1.5fr) 120px;gap:12px;align-items:center}.mvp-row select:disabled{opacity:.35;cursor:not-allowed}@media(max-width:800px){.mvp-row{grid-template-columns:1fr}}
.mono{font-family:var(--mono)}.tag{display:inline-block;padding:4px 7px;border-radius:6px;font:700 11px var(--mono);background:rgba(103,232,249,.08);color:var(--cyan)}
.flow-diagram{display:flex;flex-direction:column;gap:10px}.flow-row{display:grid;grid-template-columns:1fr 34px 1fr 34px 1fr;gap:8px;align-items:stretch}.flow-node{border:1px solid var(--border);border-radius:12px;background:rgba(17,9,48,.72);padding:13px;display:flex;flex-direction:column;gap:7px;min-height:92px}.flow-node b{font-size:13px;color:var(--purple2)}.flow-node span{font-size:12px;line-height:1.5;color:var(--muted)}.flow-node.highlight{border-color:rgba(103,232,249,.35);background:rgba(103,232,249,.05)}.flow-node.highlight b{color:var(--cyan)}.flow-node.success{border-color:rgba(52,211,153,.35);background:rgba(52,211,153,.05)}.flow-node.success b{color:var(--green)}.flow-arrow{display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:22px}.flow-connector{text-align:center;color:var(--dim);font-size:20px}@media(max-width:800px){.flow-row{grid-template-columns:1fr}.flow-arrow{transform:rotate(90deg);height:18px}.flow-node{min-height:unset}}
.callout{border-left:3px solid var(--cyan);padding:12px 14px;background:rgba(103,232,249,.05);border-radius:0 10px 10px 0;color:#d7f8fb;line-height:1.6}.warn{border-left-color:var(--amber);background:rgba(252,211,77,.04);color:#fff5c2}
.report{white-space:pre-wrap;background:#0b061c;border:1px solid var(--border);border-radius:12px;padding:16px;font:13px/1.65 var(--mono);max-height:560px;overflow:auto}.footer{margin-top:12px;color:var(--dim);font-size:12px;text-align:center}
.small{font-size:12px;color:var(--muted)}.required{color:var(--red)}.char-counter{font-size:11px;color:var(--dim);text-align:right;margin-top:5px;font-family:var(--mono)}
.classify-btn{border:1px solid var(--border2);background:rgba(28,16,64,.55);color:var(--muted);border-radius:9px;padding:10px 8px;font-family:var(--sans);font-size:.76rem;font-weight:700;cursor:pointer;transition:.16s}.classify-btn:hover{border-color:var(--accent);color:var(--text);background:rgba(124,58,237,.12)}.classify-btn.selected{border-color:var(--accent);background:rgba(124,58,237,.24);color:var(--neon);box-shadow:0 0 0 2px rgba(167,139,250,.08) inset}@media(max-width:720px){.classification-row{grid-template-columns:1fr!important}.classification-row .classify-btn{width:100%}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const STEPS = ['Registro','Detective','Subasta','Elefante','Sistema','Datos','AI Speech','Reporte'];
const STORAGE = 'pm_yape_ai_challenge';
const state = {step:0,name:'',email:'',answers:{}};
const app=document.getElementById('app');

function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(state));}catch(e){}}
function resetPersistedState(){try{localStorage.removeItem(STORAGE);}catch(e){}}
function setStep(n){state.step=n;save();render();initCharCounters();window.scrollTo({top:0,behavior:'smooth'});}
function layout(body, subtitle=''){
  const pct=Math.round((state.step/(STEPS.length-1))*100);
  return `<div class="screen"><div class="shell"><div class="top"><div><div class="logo">yape</div><div class="badge">Product Challenge — PM Yape</div></div><div class="small">${state.step+1}/${STEPS.length}</div></div><div class="progress"><div style="width:${pct}%"></div></div><div class="steps">${STEPS.map((s,i)=>`<div class="step ${i===state.step?'active':''} ${i<state.step?'done':''}">${i<state.step?'✓ ':''}${s}</div>`).join('')}</div><div class="card">${body}</div><div class="footer"></div></div></div>`;
}
function btnNext(label='Guardar y continuar →'){return `<button class="btn primary" id="nextBtn" type="button">${label}</button>`}
function btnBack(){return `<button class="btn ghost" id="backBtn" type="button">← Atrás</button>`}
function requireText(id,min=200){const v=(document.getElementById(id)?.value||'').trim();return v.length>=min}
function initCharCounters(){
  document.querySelectorAll('textarea[data-min]').forEach(el=>{
    const min=Number(el.dataset.min)||0;
    let counter=el.nextElementSibling;
    if(!counter || !counter.classList.contains('char-counter')){
      counter=document.createElement('div');
      counter.className='char-counter';
      el.insertAdjacentElement('afterend',counter);
    }
    const max=el.id==='ai1'?1200:null;
    const update=()=>{
      const n=el.value.trim().length;
      if(max!==null){
        counter.textContent=`${n} / ${min}-${max} caracteres`;
        counter.style.color=n>max?'var(--red)':n>=min?'var(--green)':'var(--dim)';
      } else {
        counter.textContent=`${n} / ${min} caracteres mínimos`;
        counter.style.color=n>=min?'var(--green)':'var(--dim)';
      }
    };
    if(!el.dataset.counterBound){el.addEventListener('input',update);el.dataset.counterBound='1';}
    update();
  });
}

function render(){
 if(state.step===0)return renderReg();
 if(state.step===1)return renderDetective();
 if(state.step===2)return renderAuction();
 if(state.step===3)return renderElephant();
 if(state.step===4)return renderSystem();
 if(state.step===5)return renderData();
 if(state.step===6)return renderAISpeech();
 return renderReport();
}

function renderReg(){
 app.innerHTML=layout(`<div class="box soft"><h1 class="title">Product Challenge — PM Yape</h1><p class="subtitle">Secuencia de decisiones de producto sobre Promos de Commerce. El reto evalúa discovery, priorización, slicing, criterio técnico, análisis de datos y criterio sobre AI.</p></div><div class="section grid grid2"><div><label>Nombre completo <span class="required">*</span></label><input id="name" value="${esc(state.name)}" placeholder="Ej. Miguel Sanchez"></div><div><label>Email (opcional)</label><input id="email" value="${esc(state.email)}" placeholder="tu@email.com"></div></div><div class="section callout">La evaluación se resuelve individualmente y toda la información necesaria está dentro del challenge. No se califica automáticamente; el reporte final consolidará las respuestas entregadas.</div><div class="btns"><span class="hint">Tiempo sugerido: 30–45 minutos.</span><button class="btn primary" id="startBtn">Iniciar challenge →</button></div>`);
 document.getElementById('startBtn').onclick=()=>{const n=document.getElementById('name').value.trim();if(!n){alert('Ingresa tu nombre para continuar.');return}state.name=n;state.email=document.getElementById('email').value.trim();setStep(1)};
}

function renderDetective(){
 const a=state.answers.detective||{};
 app.innerHTML=layout(`<span class="badge">1 · Detective del problema</span><h2>¿Qué problema investigarías primero?</h2><p class="subtitle">Usa solo la evidencia disponible. Distingue datos, insights, problemas e hipótesis dentro de la experiencia de Promos.</p><div class="section grid grid2"><div class="box"><h3>Datos del funnel de Promos</h3><div class="kpi"><span>Entran a Promos</span><b>100</b></div><div class="kpi"><span>Ven al menos una promo</span><b>76</b></div><div class="kpi"><span>Abren detalle de una promo</span><b>63</b></div><div class="kpi"><span>Inician compra</span><b>58</b></div><div class="kpi"><span>Intentan pagar</span><b>49</b></div><div class="kpi"><span>Compra de Promo exitosa</span><b>46</b></div><div class="kpi"><span>Compra de promo al mes siguiente</span><b>32%</b></div><div class="kpi"><span>Contactos CX sobre promociones, compra o redención</span><b>28%</b></div></div><div class="box"><h3>Voces de usuarios</h3><p>“No encuentro promos que realmente me interesen.”</p><p>“Cuando veo una promo, no siempre entiendo qué incluye.”</p><p>“Se me pasan las promos antes de usarlas.”</p><p>“No sé si esta promo todavía está disponible.”</p><p>“Me da miedo comprar y después no poder usar la promo.”</p></div></div><div class="section"><label>Problema 1 que investigarías · mínimo 200 caracteres <span class="required">*</span></label><div class="small">Expectativa: problema concreto + evidencia del caso + por qué merece investigación, sin proponer todavía una solución.</div><textarea id="d1" data-min="200" placeholder="Describe el problema observado, qué evidencia lo sustenta y qué consecuencia tiene para usuario o negocio.">${esc(a.p1)}</textarea></div><div class="section"><label>Problema 2 que investigarías · mínimo 200 caracteres <span class="required">*</span></label><div class="small">Expectativa: un segundo problema distinto, sustentado por evidencia y claramente separado del primero.</div><textarea id="d2" data-min="200" placeholder="Describe otro problema, la señal que lo sustenta y por qué merece investigación.">${esc(a.p2)}</textarea></div><div class="section"><label>3 datos adicionales · mínimo 200 caracteres <span class="required">*</span></label><div class="small">Expectativa: exactamente tres datos adicionales + qué incertidumbre ayudaría a resolver cada uno.</div><textarea id="d4" data-min="200" placeholder="Dato 1 y para qué; dato 2 y para qué; dato 3 y para qué.">${esc(a.more)}</textarea></div><div class="btns">${btnBack()}${btnNext()}</div>`);
 document.getElementById('backBtn').onclick=()=>setStep(0);document.getElementById('nextBtn').onclick=()=>{if(!requireText('d1')||!requireText('d2')||!requireText('d4')){alert('Cada respuesta abierta requiere al menos 200 caracteres.');return}state.answers.detective={p1:document.getElementById('d1').value,p2:document.getElementById('d2').value,more:document.getElementById('d4').value};setStep(2)};
}


const initiatives=[
 ['Recordatorios de promos',20,'Avisos sobre promos relevantes antes de que expiren.'],
 ['Personalización de promos',35,'Ordenar y recomendar promos según intereses y comportamiento.'],
 ['Favoritos',15,'Guardar promos o marcas frecuentes para encontrarlas después.'],
 ['Mejor detalle de promo',15,'Hacer más claros beneficio, condiciones, vigencia y cómo usar la promo.'],
 ['Resiliencia de compra',30,'Reducir fallos y mejorar recuperación del flujo de compra o redención.'],
 ['Integrar nuevos partners',35,'Aumentar la oferta y cobertura de promos disponibles.'],
 ['Cashback',25,'Agregar un incentivo económico para aumentar uso o recurrencia.'],
 ['Migración técnica',40,'Modernizar una base técnica para reducir dependencia o riesgo futuro.']
];
function renderAuction(){
 const a=state.answers.auction||{sel:[]};
 app.innerHTML=layout(`<span class="badge">2 · Subasta de oportunidades</span><h2>¿Dónde invertirías la capacidad?</h2><p class="subtitle">Partiendo de los pains que identificaste en el reto anterior, decide dónde invertirías la capacidad limitada del equipo y qué apuestas priorizarías.</p><div class="section callout soft"><b>Continuación del reto anterior</b><p class="small" style="margin-top:8px">Usa el análisis que acabas de realizar como punto de partida para seleccionar las iniciativas que priorizarías.</p></div><p class="small" style="margin-bottom:14px"><b>Capacidad disponible:</b> 100 puntos. Selecciona las iniciativas que comprometerías.</p><div class="section grid grid3">${initiatives.map(([n,c,d])=>`<label class="choice-card"><input type="checkbox" class="initCheck" value="${n}" data-cost="${c}" ${a.sel?.includes(n)?'checked':''}><div class="inner"><div style="display:flex;justify-content:space-between;gap:8px"><b>${n}</b><span class="tag">${c} pts</span></div><div class="small" style="margin-top:8px;line-height:1.5">${d}</div></div></label>`).join('')}</div><div class="section box"><div style="display:flex;justify-content:space-between"><b>Capacidad seleccionada</b><b id="totalCost">0 / 100</b></div><div class="small" style="margin-top:6px">Los puntos representan capacidad disponible del equipo; el límite no se puede exceder.</div></div><div class="section"><label>Problema + métrica · mínimo 200 caracteres <span class="required">*</span></label><div class="small">Expectativa: para las iniciativas elegidas, explica qué problema atacas y qué métrica esperas mover.</div><textarea id="a1" data-min="200" placeholder="Relaciona cada apuesta con el problema que resuelve y la métrica que esperas impactar.">${esc(a.just)}</textarea></div><div class="section"><label>Qué NO harías · mínimo 200 caracteres <span class="required">*</span></label><div class="small">Expectativa: iniciativas que dejas fuera + criterio de priorización, trade-off o restricción que lo explica.</div><textarea id="a2" data-min="200" placeholder="Explica qué descartas y por qué no usarías capacidad en esas iniciativas.">${esc(a.no)}</textarea></div><div class="section callout warn"><b>Nueva información:</b> Marketing informa que ya tiene comprometida una campaña de <b>Cashback</b> asociada a Promos. Debes incluir Cashback. No recibes capacidad adicional.</div><div class="section"><label>Repriorización por Cashback · mínimo 200 caracteres <span class="required">*</span></label><div class="small">Expectativa: qué cambias, qué sacrificas o renegocias y por qué mantienes o cambias el objetivo.</div><textarea id="a3" data-min="200" placeholder="Explica el nuevo trade-off y qué iniciativa(s) salen o se reducen.">${esc(a.change)}</textarea></div><div class="btns">${btnBack()}${btnNext()}</div>`);
 const checks=[...document.querySelectorAll('.initCheck')];
 const getSelected=()=>checks.filter(c=>c.checked).map(c=>c.value);
 const refresh=()=>{let t=checks.filter(c=>c.checked).reduce((sum,c)=>sum+Number(c.dataset.cost),0);document.getElementById('totalCost').textContent=t+' / 100';document.getElementById('totalCost').style.color=t>100?'var(--red)':'var(--green)';};
 checks.forEach(c=>c.addEventListener('change',refresh));refresh();
 document.getElementById('backBtn').onclick=()=>setStep(1);document.getElementById('nextBtn').onclick=()=>{const selected=getSelected();const total=selected.reduce((sum,n)=>{const item=initiatives.find(x=>x[0]===n);return sum+(item?item[1]:0)},0);if(!selected.length||total>100){alert(total>100?'La selección supera 100 puntos de capacidad. Ajusta el plan.':'Selecciona al menos una iniciativa.');return}if(!requireText('a1')||!requireText('a2')||!requireText('a3')){alert('Cada respuesta abierta requiere al menos 200 caracteres.');return}state.answers.auction={sel:selected,just:document.getElementById('a1').value,no:document.getElementById('a2').value,change:document.getElementById('a3').value,total};setStep(3)};
}



const components=[
 ['Señales de preferencia','Usar comportamiento disponible —por ejemplo vistas, clics o compras previas— para inferir qué tipos de promos podrían ser relevantes.'],
 ['Elegibilidad de promos','Evitar recomendar promos que el usuario no puede comprar, que no están vigentes o que no están disponibles para su segmento.'],
 ['Ranking personalizado','Ordenar las promos disponibles según una estimación de relevancia para cada usuario.'],
 ['Feed personalizado','Mostrar el ranking dentro de una experiencia visible de Promos y permitir que el usuario explore alternativas.'],
 ['Fallback general','Mostrar un catálogo no personalizado cuando no exista suficiente información del usuario o falle la personalización.'],
 ['Feedback de relevancia','Permitir capturar señales explícitas o implícitas sobre si las recomendaciones resultan útiles para mejorar el aprendizaje.'],
 ['Medición del experimento','Instrumentar exposición, interacción, compra y recurrencia para comparar la experiencia personalizada contra una alternativa de control.'],
 ['Manejo de errores','Definir qué ocurre si el ranking no responde, entrega resultados inválidos o una promo deja de estar disponible.'],
 ['Favoritos y recordatorios','Permitir guardar promos y recibir recordatorios para facilitar una compra posterior.'],
 ['Dashboard operativo','Dar visibilidad interna sobre desempeño del ranking, errores y principales métricas del experimento.']
];
function renderElephant(){
 const a=state.answers.elephant||{mvp:[],later:[],no:[],sprint:{}};
 const selected={};
 (a.mvp||[]).forEach(x=>selected[x]='mvp');
 (a.later||[]).forEach(x=>selected[x]='later');
 (a.no||[]).forEach(x=>selected[x]='no');
 const sprintMap=a.sprint||{};
 const rows=components.map(([c,d],i)=>{const isMvp=selected[c]==='mvp';const sp=sprintMap[c]||'';return `<div class="box mvp-row" style="padding:14px;margin-bottom:10px"><div><b>${i+1}. ${c}</b><div class="small" style="margin-top:5px;line-height:1.5">${d}</div></div><div class="classification-row" data-component="${esc(c)}" style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px"><button type="button" class="classify-btn ${selected[c]==='mvp'?'selected':''}" data-value="mvp">MVP</button><button type="button" class="classify-btn ${selected[c]==='later'?'selected':''}" data-value="later">DESPUÉS</button><button type="button" class="classify-btn ${selected[c]==='no'?'selected':''}" data-value="no">NO NECESARIO</button></div><select class="sprint-select mvpSprint" data-component="${esc(c)}" ${isMvp?'':'disabled'}><option value="">Sprint</option><option value="1" ${sp==='1'?'selected':''}>Sprint 1</option><option value="2" ${sp==='2'?'selected':''}>Sprint 2</option><option value="3" ${sp==='3'?'selected':''}>Sprint 3</option></select></div>`}).join('');
 app.innerHTML=layout(`<span class="badge">3 · Corta el elefante</span><h2>Convierte una apuesta de 5 meses en un experimento de 6 semanas</h2><p class="subtitle">La apuesta es <b>Personalización de Promos</b>: mostrar primero promos que tengan mayor probabilidad de ser relevantes para cada usuario. Tienes 6 semanas para aprender si puede aumentar la compra recurrente de promos. <b>1 sprint = 2 semanas</b>, por lo que dispones de 3 sprints.</p><div class="section box"><b>Clasifica y secuencia cada capacidad</b><div class="small" style="margin-top:6px">Elige una sola opción por capacidad. Si marcas <b>MVP</b>, además debes indicar en qué sprint la desarrollarías. <b>DESPUÉS</b> y <b>NO NECESARIO</b> no requieren sprint.</div></div><div class="section">${rows}</div><div class="section"><label>Plan de sprints y criterio de decisión · mínimo 350 caracteres <span class="required">*</span></label><div class="small">Expectativa: explica por qué distribuyes las iniciativas MVP en esos sprints y qué evidencia concreta esperas obtener en cada etapa para continuar, iterar o detener la apuesta.</div><textarea id="e4" data-min="350" placeholder="Explica la lógica de secuenciación, qué necesitas aprender en cada sprint y qué evidencia te haría continuar, iterar o detener la apuesta.">${esc(a.learn)}</textarea></div><div class="btns">${btnBack()}${btnNext()}</div>`);
 document.querySelectorAll('.classification-row').forEach(row=>{
   row.querySelectorAll('.classify-btn').forEach(btn=>btn.addEventListener('click',()=>{
     row.querySelectorAll('.classify-btn').forEach(b=>b.classList.remove('selected'));
     btn.classList.add('selected');
     const select=row.parentElement.querySelector('.mvpSprint');
     select.disabled=btn.dataset.value!=='mvp';
     if(btn.dataset.value!=='mvp')select.value='';
   }));
 });
 document.getElementById('backBtn').onclick=()=>setStep(2);
 document.getElementById('nextBtn').onclick=()=>{
   const groups={mvp:[],later:[],no:[]}; const sprint={};
   const rows=[...document.querySelectorAll('.classification-row')];
   for(const row of rows){
     const choice=row.querySelector('.classify-btn.selected');
     if(!choice){alert('Clasifica las 10 capacidades antes de continuar. Cada una debe tener una opción: MVP, Después o No necesario.');return}
     const name=row.dataset.component; groups[choice.dataset.value].push(name);
     if(choice.dataset.value==='mvp'){const sp=row.parentElement.querySelector('.mvpSprint').value;if(!sp){alert('Cada iniciativa marcada como MVP debe tener un sprint asignado entre 1 y 3.');return}sprint[name]=sp}
   }
   if(!requireText('e4',350)){alert('Completa la respuesta abierta con el mínimo de 350 caracteres.');return}
   state.answers.elephant={...groups,sprint,learn:document.getElementById('e4').value};setStep(4)
 };
}

ight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--amber);margin-bottom:6px">⚠ Escenario evaluado · Core del reto</div><b>El usuario presiona <span style="color:var(--amber)">Comprar</span>, permanece en <span style="color:var(--amber)">“Procesando…”</span> durante 10 segundos y vuelve a presionar <span style="color:var(--amber)">Comprar</span>.</b></div></div><div class="section callout"><b>Tu foco:</b> a partir del flujo anterior, razona qué puede estar ocurriendo, qué riesgos aparecen, qué necesitas entender del sistema y cómo debería responder la experiencia ante la incertidumbre.</div><div class="section grid grid2"><div><label>Qué podría estar ocurriendo · mínimo 150 caracteres <span class="required">*</span></label><div class="small">Expectativa: formula una o más hipótesis sobre el estado de la compra, el pago o la comunicación entre componentes.</div><textarea id="s2" data-min="150" placeholder="Explica qué hipótesis investigarías primero y por qué.">${esc(a.what)}</textarea></div><div><label>Riesgos · mínimo 150 caracteres <span class="required">*</span></label><div class="small">Expectativa: identifica riesgos para dinero, orden, experiencia, consistencia o doble ejecución y explica sus consecuencias.</div><textarea id="s3" data-min="150" placeholder="Qué podría salir mal, a quién afecta y por qué.">${esc(a.risk)}</textarea></div><div><label>Preguntas al Tech Lead · mínimo 150 caracteres <span class="required">*</span></label><div class="small">Expectativa: formula preguntas que reduzcan incertidumbre técnica relevante para una decisión de Producto.</div><textarea id="s4" data-min="150" placeholder="Qué necesitas entender del sistema antes de decidir.">${esc(a.tech)}</textarea></div><div><label>Experiencia del usuario · mínimo 150 caracteres <span class="required">*</span></label><div class="small">Expectativa: define qué debería ver, saber o poder hacer el usuario mientras la compra está incierta.</div><textarea id="s5" data-min="150" placeholder="Estados, mensajes, acciones disponibles y límites.">${esc(a.ux)}</textarea></div></div><div class="btns">${btnBack()}${btnNext()}</div>`);
 document.getElementById('backBtn').onclick=()=>setStep(3);document.getElementById('nextBtn').onclick=()=>{if(!requireText('s2',150)||!requireText('s3',150)||!requireText('s4',150)||!requireText('s5',150)){alert('Completa todas las respuestas abiertas con los mínimos indicados.');return}state.answers.system={what:document.getElementById('s2').value,risk:document.getElementById('s3').value,tech:document.getElementById('s4').value,ux:document.getElementById('s5').value};setStep(5)};
